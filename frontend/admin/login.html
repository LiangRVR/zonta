<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Zonta Club of Naples</title>
  <link rel="icon" type="image/png" href="../images/zontalogo_gold.png">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-login-container">
    <div class="admin-login-box">
      <div class="admin-logo">
        <img src="../images/zontalogo_gold.png" alt="Zonta Club of Naples" style="width: 100px; height: auto; margin-bottom: 15px;">
        <h2>Admin Login</h2>
        <p>Zonta Club of Naples</p>
      </div>

      <div id="error-message" class="error-message" style="display: none;"></div>
      <div id="success-message" class="success-message" style="display: none;"></div>

      <form id="login-form" class="admin-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            placeholder="admin@example.com"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="Enter your password"
          >
        </div>

        <button type="submit" class="btn-primary" id="login-btn">
          Sign In
        </button>
      </form>

      <div class="admin-links">
        <a href="#" id="forgot-password-link">Forgot Password?</a>
        <span>•</span>
        <a href="../index.html">Back to Site</a>
      </div>
    </div>
  </div>

  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
