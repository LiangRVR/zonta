<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products Management - Zonta Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <h2>Zonta Admin</h2>
      </div>

      <nav class="admin-nav">
        <a href="dashboard.html" class="nav-item">
          <span class="icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="orders.html" class="nav-item">
          <span class="icon">📦</span>
          <span>Orders</span>
        </a>
        <a href="products.html" class="nav-item active">
          <span class="icon">🛍️</span>
          <span>Products</span>
        </a>
        <a href="../index.html" class="nav-item">
          <span class="icon">🌐</span>
          <span>View Site</span>
        </a>
      </nav>

      <div class="admin-user">
        <div class="user-info">
          <span class="user-icon">👤</span>
          <span class="user-email" id="user-email">Loading...</span>
        </div>
        <button class="btn-logout" id="logout-btn">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-header">
        <h1>Products Management</h1>
        <div class="header-actions">
          <button class="btn-primary" id="add-product-btn">+ Add Product</button>
          <button class="btn-refresh" id="refresh-btn">🔄 Refresh</button>
        </div>
      </header>

      <div class="admin-content">
        <!-- Filters -->
        <div class="filters-bar">
          <div class="filter-group">
            <label for="active-filter">Show:</label>
            <select id="active-filter" class="filter-select">
              <option value="all">All Products</option>
              <option value="active">Active Only</option>
              <option value="inactive">Inactive Only</option>
            </select>
          </div>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="loading-state">
          <div class="spinner"></div>
          <p>Loading products...</p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="error-state" style="display: none;">
          <p>Failed to load products. Please try again.</p>
        </div>

        <!-- Products Table -->
        <div id="products-content" style="display: none;">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Image</th>
                  <th>Name</th>
                  <th>Description</th>
                  <th>Price</th>
                  <th>Category</th>
                  <th>Stock</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="products-table-body">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Product Form Modal -->
  <div id="product-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Add Product</h2>
        <button class="modal-close" id="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="product-form" class="admin-form">
          <input type="hidden" id="product-id" name="id">

          <div class="form-group">
            <label for="product-name">Product Name *</label>
            <input type="text" id="product-name" name="name" required>
          </div>

          <div class="form-group">
            <label for="product-description">Description</label>
            <textarea id="product-description" name="description" rows="3"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="product-price">Price (USD) *</label>
              <input type="number" id="product-price" name="price" step="0.01" min="0" required>
            </div>

            <div class="form-group">
              <label for="product-stock">Stock</label>
              <input type="number" id="product-stock" name="stock" min="0" value="0">
            </div>
          </div>

          <div class="form-group">
            <label for="product-category">Category</label>
            <input type="text" id="product-category" name="category" placeholder="e.g., Apparel, Accessories">
          </div>

          <div class="form-group">
            <label for="product-image">Image Emoji</label>
            <input type="text" id="product-image" name="image" placeholder="e.g., 👕 or 👜" maxlength="10">
          </div>

          <div class="form-group">
            <label for="product-image-url">Image URL</label>
            <input type="url" id="product-image-url" name="image_url" placeholder="https://...">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="product-display-order">Display Order</label>
              <input type="number" id="product-display-order" name="display_order" value="0">
            </div>

            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="product-active" name="active" checked>
                Active (visible in shop)
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" id="cancel-btn">Cancel</button>
            <button type="submit" class="btn-primary" id="save-btn">Save Product</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-api.js"></script>
  <script src="../js/admin-products.js"></script>
</body>
</html>
