<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Zonta Club of Naples</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <h2>Zonta Admin</h2>
      </div>

      <nav class="admin-nav">
        <a href="dashboard.html" class="nav-item active">
          <span class="icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="orders.html" class="nav-item">
          <span class="icon">📦</span>
          <span>Orders</span>
        </a>
        <a href="products.html" class="nav-item">
          <span class="icon">🛍️</span>
          <span>Products</span>
        </a>
        <a href="../index.html" class="nav-item">
          <span class="icon">🌐</span>
          <span>View Site</span>
        </a>
      </nav>

      <div class="admin-user">
        <div class="user-info">
          <span class="user-icon">👤</span>
          <span class="user-email" id="user-email">Loading...</span>
        </div>
        <button class="btn-logout" id="logout-btn">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main" style="flex: 1; background: var(--light-gray); padding: 0; display: flex; height: 100vh; overflow: hidden;">

      <!-- Orders List Panel -->
      <div id="orders-list-panel" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
        <header class="admin-header" style="flex-shrink: 0;">
          <h1>Orders</h1>
          <div class="header-actions">
            <button class="btn-refresh" id="refresh-btn">🔄 Refresh</button>
          </div>
        </header>

        <div class="admin-content" style="flex: 1; overflow-y: auto;">
          <!-- Loading State -->
          <div id="loading-state" class="loading-state">
            <div class="spinner"></div>
            <p>Loading dashboard data...</p>
          </div>

          <!-- Error State -->
          <div id="error-state" class="error-state" style="display: none;">
            <p>Failed to load dashboard data. Please try again.</p>
            <button class="btn-primary" onclick="window.location.reload()">Retry</button>
          </div>

          <!-- Dashboard Content -->
          <div id="dashboard-content" style="display: none;">
            <!-- Filters -->
            <div style="margin-bottom: 20px; display: flex; gap: 10px;">
              <select class="filter-select" id="filter-status">
                <option value="">Any status</option>
                <option value="pending">Pending</option>
                <option value="paid">Paid</option>
                <option value="preparing">Preparing</option>
                <option value="shipped">Shipped</option>
                <option value="delivered">Delivered</option>
                <option value="canceled">Canceled</option>
              </select>
              <select class="filter-select" id="filter-sort">
                <option value="date-desc">Sort by Date (Newest)</option>
                <option value="date-asc">Sort by Date (Oldest)</option>
                <option value="amount-desc">Sort by Amount (High-Low)</option>
                <option value="amount-asc">Sort by Amount (Low-High)</option>
              </select>
            </div>

            <!-- Orders Table -->
            <div class="admin-card">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>
                      <input type="checkbox" id="select-all-orders">
                    </th>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Status</th>
                    <th>Total</th>
                    <th>Date</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="orders-table-body">
                  <!-- Dynamically populated -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- Order Details Panel -->
      <div id="order-details-panel" style="width: 400px; max-width: 400px; background: var(--white); box-shadow: -5px 0 20px rgba(0,0,0,0.05); padding: 24px; display: none; flex-direction: column; overflow-y: auto; flex-shrink: 0;">
        <!-- Dynamically populated by JavaScript -->
      </div>

    </main>
  </div>

  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-api.js"></script>
  <script src="../js/admin-dashboard.js"></script>
</body>
</html>
