<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Management - Zonta Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <h2>Zonta Admin</h2>
      </div>

      <nav class="admin-nav">
        <a href="dashboard.html" class="nav-item">
          <span class="icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="orders.html" class="nav-item active">
          <span class="icon">📦</span>
          <span>Orders</span>
        </a>
        <a href="products.html" class="nav-item">
          <span class="icon">🛍️</span>
          <span>Products</span>
        </a>
        <a href="../index.html" class="nav-item">
          <span class="icon">🌐</span>
          <span>View Site</span>
        </a>
      </nav>

      <div class="admin-user">
        <div class="user-info">
          <span class="user-icon">👤</span>
          <span class="user-email" id="user-email">Loading...</span>
        </div>
        <button class="btn-logout" id="logout-btn">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main" style="flex: 1; background: var(--light-gray); padding: 0; display: flex; height: 100vh; overflow: hidden;">

      <!-- Orders List Panel -->
      <div id="orders-list-panel" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
        <header class="admin-header" style="flex-shrink: 0;">
          <h1>Orders Management</h1>
          <div class="header-actions">
            <button class="btn-refresh" id="refresh-btn">🔄 Refresh</button>
          </div>
        </header>

        <div class="admin-content" style="flex: 1; overflow-y: auto;">
          <!-- Filters -->
          <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
            <select id="status-filter" class="filter-select">
              <option value="">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="paid">Paid</option>
              <option value="preparing">Preparing</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
              <option value="canceled">Canceled</option>
              <option value="refunded">Refunded</option>
              <option value="failed">Failed</option>
            </select>

            <select id="sort-filter" class="filter-select">
              <option value="created_at-desc">Newest First</option>
              <option value="created_at-asc">Oldest First</option>
              <option value="total_amount-desc">Highest Amount</option>
              <option value="total_amount-asc">Lowest Amount</option>
            </select>
          </div>

          <!-- Loading State -->
          <div id="loading-state" class="loading-state">
            <div class="spinner"></div>
            <p>Loading orders...</p>
          </div>

          <!-- Error State -->
          <div id="error-state" class="error-state" style="display: none;">
            <p>Failed to load orders. Please try again.</p>
          </div>

          <!-- Orders Table -->
          <div id="orders-content" style="display: none;">
            <div class="admin-card">
              <table style="width: 100%; border-collapse: collapse;">
                <thead style="background: #f9fafb; border-bottom: 1px solid #e5e7eb;">
                  <tr>
                    <th style="padding: 16px; text-align: left; color: var(--gray); font-weight: 600; font-size: 12px; text-transform: uppercase;">
                      <input type="checkbox" id="select-all-orders">
                    </th>
                    <th style="padding: 16px; text-align: left; color: var(--gray); font-weight: 600; font-size: 12px; text-transform: uppercase;">Order ID</th>
                    <th style="padding: 16px; text-align: left; color: var(--gray); font-weight: 600; font-size: 12px; text-transform: uppercase;">Customer</th>
                    <th style="padding: 16px; text-align: left; color: var(--gray); font-weight: 600; font-size: 12px; text-transform: uppercase;">Status</th>
                    <th style="padding: 16px; text-align: left; color: var(--gray); font-weight: 600; font-size: 12px; text-transform: uppercase;">Total</th>
                    <th style="padding: 16px; text-align: left; color: var(--gray); font-weight: 600; font-size: 12px; text-transform: uppercase;">Date</th>
                    <th style="padding: 16px;"></th>
                  </tr>
                </thead>
                <tbody id="orders-table-body">
                  <!-- Dynamically populated -->
                </tbody>
              </table>
            </div>

            <div class="pagination" id="pagination" style="margin-top: 20px; display: flex; justify-content: center; gap: 10px;">
              <!-- Pagination controls will be added here -->
            </div>
          </div>
        </div>
      </div>

      <!-- Order Details Panel -->
      <div id="order-details-panel" style="width: 400px; max-width: 400px; background: var(--white); box-shadow: -5px 0 20px rgba(0,0,0,0.05); padding: 24px; display: none; flex-direction: column; overflow-y: auto; flex-shrink: 0;">
        <!-- Dynamically populated by JavaScript -->
      </div>

    </main>
  </div>

  <!-- Order Detail Modal (Removed) -->
  <!-- <div id="order-modal" class="modal" style="display: none;">...</div> -->

  <script src="../js/admin-auth.js"></script>
  <script src="../js/admin-api.js"></script>
  <script src="../js/admin-orders.js"></script>
</body>
</html>
