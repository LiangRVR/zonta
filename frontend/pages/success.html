<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful - Zonta Club of Naples</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/shop.css">
    <style>
        .success-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 2rem;
            text-align: center;
        }

        .success-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            color: #4CAF50;
        }

        .success-container h1 {
            color: #333;
            margin-bottom: 1rem;
        }

        .success-container p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .order-details {
            background-color: #f5f5f5;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 2rem 0;
            text-align: left;
        }

        .order-details h2 {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .order-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .order-info strong {
            color: #333;
        }

        .order-info span {
            color: #666;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        .btn-primary {
            background-color: #8B4789;
            color: white;
        }

        .btn-primary:hover {
            background-color: #6d3768;
        }

        .btn-secondary {
            background-color: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background-color: #e0e0e0;
        }

        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div id="header"></div>

    <main>
        <div class="success-container">
            <div class="success-icon">✓</div>
            <h1>Order Successful!</h1>
            <p>Thank you for your purchase from the Zonta Club of Naples shop.</p>
            <p>A confirmation email has been sent to your email address.</p>

            <div class="order-details" id="orderDetails">
                <h2>Order Details</h2>
                <div class="loading">Loading order information...</div>
            </div>

            <div class="action-buttons">
                <a href="../index.html" class="btn btn-primary">Return to Home</a>
                <a href="shop.html" class="btn btn-secondary">Continue Shopping</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="../js/nav-footer-share.js"></script>
    <script>
        const API_URL = 'http://localhost:3000';

        // Get session ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        async function loadOrderDetails() {
            const orderDetailsDiv = document.getElementById('orderDetails');

            if (!sessionId) {
                orderDetailsDiv.innerHTML = `
                    <p style="color: #666;">No order information available.</p>
                `;
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/stripe/session/${sessionId}`);

                if (!response.ok) {
                    throw new Error('Failed to fetch order details');
                }

                const data = await response.json();

                orderDetailsDiv.innerHTML = `
                    <h2>Order Details</h2>
                    <div class="order-info">
                        <strong>Order ID:</strong>
                        <span>${sessionId.substring(0, 20)}...</span>
                    </div>
                    <div class="order-info">
                        <strong>Status:</strong>
                        <span style="color: #4CAF50; text-transform: capitalize;">${data.status}</span>
                    </div>
                    <div class="order-info">
                        <strong>Email:</strong>
                        <span>${data.customer_email || 'N/A'}</span>
                    </div>
                    <div class="order-info">
                        <strong>Total Amount:</strong>
                        <span>$${data.amount_total ? data.amount_total.toFixed(2) : '0.00'} ${data.currency ? data.currency.toUpperCase() : 'USD'}</span>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading order details:', error);
                orderDetailsDiv.innerHTML = `
                    <p style="color: #666;">Unable to load order details at this time.</p>
                `;
            }
        }

        // Load order details when page loads
        if (sessionId) {
            loadOrderDetails();
        }
    </script>
</body>
</html>
