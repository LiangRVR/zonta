<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonta in Action | Zonta Club of Naples</title>
    <meta name="description" content="Join us at our meetings and events. See Zonta Club of Naples in action.">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div data-include="../includes/header.html"></div>

    <section class="meeting-section" id="action" style="margin-top: 70px;">
        <div class="container">
            <h2 class="section-title">Join Us at Our Next Meeting!</h2>
            <p class="section-subtitle">Members and non-members are invited to the Zonta Club of Naples meetings</p>
            <div class="meeting-flyer">
                <img src="../images/meeting-flyer.jpg" alt="Zonta Meeting Dates and Location">
            </div>
            <p style="margin-top: 1.5rem; color: var(--gray); font-size: 1.1rem;">All are responsible to pay for their own lunch • Click the image to find out more!</p>
        </div>
    </section>

    <section class="faq-section">
        <div class="container">
            <h2 class="section-title">Have Questions?</h2>
            <p class="section-subtitle">We have answers! Learn more about Zonta Club of Naples</p>
            <div class="faq-image">
                <img src="../images/qa-image.jpg" alt="Questions and Answers">
            </div>
            <p style="margin-top: 1.5rem; color: var(--gray); font-size: 1.1rem;">Click the image to find out more!</p>
        </div>
    </section>

    <div data-include="../includes/footer.html"></div>

    <script type="module" src="../js/main.js"></script>
</body>
</html>
